plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        if (System.getenv('WV_KEYSTORE_PATH')) {
            deviceTest {
                storeFile file(System.getenv('WV_KEYSTORE_PATH'))
                storePassword System.getenv('WV_STORE_PASSWORD')
                keyAlias 'wandervision'
                keyPassword System.getenv('WV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('WV_KEYSTORE_PATH')) signingConfig signingConfigs.deviceTest
        }
    }
    namespace 'com.tencent.yolov8ncnn'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    ndkVersion "29.0.14206865" 

    defaultConfig {
        applicationId "io.github.lvshanyewu.wandervision"
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters (project.findProperty('testAbi') ?: 'arm64-v8a') }

        minSdkVersion 24
        targetSdkVersion 35

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.31.5"
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
